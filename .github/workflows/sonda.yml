name: sonda
# Cada 10 minuts arrenca una execució que comprova cada minut durant ~9 minuts (GitHub pot endarrerir els cron).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write   # desar resultats pendents (només durant una caiguda) i l'estat diari
  id-token: write   # token OIDC per identificar-se davant de l'SJD-MIP (i d'Azure, per als avisos)
concurrency:
  group: sonda
  cancel-in-progress: false
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Comprovar l'SJD-MIP
        env:
          TARGETS: '[{"env":"prova","base":"https://hsjd-mip.appliant.eu"},{"env":"formacio","base":"https://hsjd-mip.appliant.eu:8443"}]'
          MAIN_ENV: prova
          # avís per Azure (correu + SMS): identificadors, no secrets; l'accés és per credencial federada d'aquest repo
          AZ_TENANT: 91f89255-7c5a-470c-8cda-ebff9aed08f6
          AZ_CLIENT: 824220b0-74a1-4fe3-bbb7-584483d42f23
          AZ_SUB: db5d0bfe-0216-4fee-b078-1e9aabae34f8
          AZ_RG_CAIGUDA: rg-hsjd-mip-avis-caiguda
          AZ_RG_RECUPERAT: rg-hsjd-mip-avis-recuperat
        run: python3 sonda.py
      - name: Desar l'estat (si ha canviat)
        if: always()
        run: |
          git config user.name 'sonda'; git config user.email 'sonda@users.noreply.github.com'
          git add -A estat
          git diff --cached --quiet && exit 0
          git commit -qm "estat $(date -u +%F\ %H:%M)" && (git push -q || (git pull -q --rebase && git push -q))
